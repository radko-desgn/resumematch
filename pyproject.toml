[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumematch"
version = "0.1.0"
description = "AI-powered resume-to-job-fit analyzer: fit score, evidence-backed gap analysis, and tailored bullet rewrites."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
resumematch = "resumematch.cli:main"

[tool.setuptools.packages.find]
include = ["resumematch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
