name: Keep backend warm

# Render's free tier spins the API down after ~15 min idle, so the first real
# visitor waits ~30-60s for a cold start. Pinging the health endpoint every
# ~10 min keeps it awake. (GitHub's scheduler can run late under load, so an
# occasional cold start is still possible; upgrade Render to remove it entirely.)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: curl -fsS --max-time 60 https://resumematch-api-40kl.onrender.com/api/health || true
